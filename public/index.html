<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bili Cache Watch</title>
    <link rel="stylesheet" href="/styles.css?v=stable-local-danmaku-fullscreen">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Bili Cache Watch</h1>
          <p>缓存视频 BV 号导入、状态检查和删除/受限提醒</p>
        </div>
        <div class="top-actions">
          <button id="checkAll">全部检查</button>
          <form method="post" action="/logout">
            <button type="submit">退出</button>
          </form>
        </div>
      </header>

      <section class="panel">
        <form id="addForm" class="add-form">
          <input name="bvid" placeholder="BV 号或视频链接" required>
          <input name="title" placeholder="标题，可选">
          <button type="submit">添加</button>
        </form>
      </section>

      <section class="panel import-panel">
        <div class="section-head">
          <div>
            <h2>缓存导入</h2>
            <p>从安卓模拟器或本地缓存目录读取 Bilibili entry.json</p>
          </div>
          <button id="importAndroid">从安卓模拟器导入</button>
        </div>
        <form id="localImportForm" class="local-import-form">
          <input name="path" placeholder="本地缓存目录，例如 D:\BiliCache\download 或手机导出的 tv.danmaku.bili\download">
          <button type="submit">从本地路径导入</button>
        </form>
        <form id="phoneImportForm" class="phone-import-form">
          <input name="path" value="此电脑\REDMI K90 Pro Max\Internal shared storage\Android\data\tv.danmaku.bili\download">
          <button type="submit">从真实手机复制并导入</button>
        </form>
        <div class="hint">使用真实手机导入前，请确认数据线已连接、手机已允许电脑访问文件，并且上方路径是手机里的 Bilibili download 目录。</div>
        <div id="importStatus" class="import-status">等待导入</div>
      </section>

      <section class="toolbar">
        <button data-filter="all" class="active">全部</button>
        <button data-filter="removed">疑似删除</button>
        <button data-filter="restricted">受限</button>
        <button data-filter="available">正常</button>
      </section>

      <section id="videos" class="video-list"></section>
    </main>

    <script src="/vendor/danmaku/danmaku.min.js"></script>
    <script src="/app.js?v=stable-local-danmaku-fullscreen"></script>
  </body>
</html>
