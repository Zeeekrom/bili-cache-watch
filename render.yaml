services:
  - type: web
    name: bili-cache-watch
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /login
    disk:
      name: bili-cache-data
      mountPath: /app/data
      sizeGB: 10
    envVars:
      - key: PORT
        value: 3001
      - key: BILI_INVITE_CODE
        value: reeshiram-YuBirdSing-202605
      - key: BILI_AUTH_SECRET
        sync: false
      - key: CHECK_INTERVAL_MINUTES
        value: 60
